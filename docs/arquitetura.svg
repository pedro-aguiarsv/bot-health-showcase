  <text x="40" y="48" fill="#0f172a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="650">Bot Health</text>
  <text x="40" y="74" fill="#64748b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">O app registra o treino. O relógio e o Telegram só completam.</text>
