  <text x="140" y="152" text-anchor="middle" fill="#0f172a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650">PWA</text>
  <text x="140" y="172" text-anchor="middle" fill="#64748b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">celular, na academia</text>
  <rect x="40" y="230" width="200" height="72" rx="16" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="140" y="262" text-anchor="middle" fill="#0f172a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650">Telegram</text>
  <text x="140" y="282" text-anchor="middle" fill="#64748b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">atalho de registro</text>
  <rect x="40" y="340" width="200" height="72" rx="16" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="140" y="372" text-anchor="middle" fill="#0f172a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650">Cron</text>
  <text x="140" y="392" text-anchor="middle" fill="#64748b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">todo dia, na Vercel</text>
  <rect x="370" y="214" width="220" height="120" rx="18" fill="#0e7490"/>
  <text x="480" y="262" text-anchor="middle" fill="#ffffff" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="650">Next.js</text>
  <text x="480" y="286" text-anchor="middle" fill="#ecfeff" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">app e API no mesmo projeto</text>
  <text x="480" y="306" text-anchor="middle" fill="#ecfeff" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">monta o histórico da IA</text>
  <rect x="720" y="120" width="200" height="72" rx="16" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="820" y="152" text-anchor="middle" fill="#0f172a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650">Neon Postgres</text>
  <text x="820" y="172" text-anchor="middle" fill="#64748b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">treinos, hábitos, sono</text>
  <rect x="720" y="230" width="200" height="72" rx="16" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="820" y="262" text-anchor="middle" fill="#0f172a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650">Garmin</text>
  <text x="820" y="282" text-anchor="middle" fill="#64748b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">sono, passos, cardio</text>
  <rect x="720" y="340" width="200" height="72" rx="16" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="820" y="372" text-anchor="middle" fill="#0f172a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="650">Gemini</text>
  <text x="820" y="392" text-anchor="middle" fill="#64748b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">responde só o que recebeu</text>
