  <text x="40" y="470" fill="#475569" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">A duração da musculação nasce no PWA. Frequência e calorias só entram se o Garmin cobriu aquele horário.</text>
  <text x="40" y="494" fill="#475569" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">O cron puxa o relógio e grava no banco. A pergunta da IA leva um texto com os últimos 30 dias, não uma consulta livre.</text>
  <text x="40" y="530" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">Diagrama da vitrine. Nenhum dado pessoal.</text>
